# Sanitized site. Copy this directory to ~/.config/agentkit and edit it there.
# Nothing in this file is a real host, address, or secret.
schema = 1
manage_model = false

[models]
claude_model = "example-model"
claude_effort = "medium"
codex_model = "example-model"
codex_effort = "medium"
cursor_model = "example-model"

[[projects]]
name = "example"
path = "work/example"

[guards]
# Hosts where one whole `ssh <host> '<command>'` may hard-delete, because that
# machine's Trash is not a recovery path. Leave empty unless you have one.
air_hosts = []
air_aliases = []
allowed_cd = [
  "~/Projects",
  "~/.cursor/worktrees",
  "~/.local/state",
  "~/.claude",
  "/tmp",
  "/private/tmp",
  "/var/folders",
]
push_markers = ["AGENTKIT_PUSH_APPROVED=1"]
push_gate_projects = []
# push_gate_projects = ["~/Projects/example"]   # by folder
# push_gate_remotes = ["owner/name"]            # by remote: every clone and worktree of that repository
# email_substrings_file = "private/email-substrings.txt"
# The four below have built-in defaults; set one only to change it.
# slot_state_dir = "~/.local/state/heavy-slot"       # slot-holder, slot-files: heavy-slot's state directory
# slot_files = ["limit", "cool"]                     # slot-files: files in it that are not edited by hand
# approval_file_patterns = ["APPROVE_*"]             # approval-files: marker files only the owner creates
# idrive_cleanup_patterns = ['(?i)archive[\s_.-]*clean[\s_-]*up']   # idrive-cleanup: regular expressions
