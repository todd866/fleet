name: Fleet
options:
  bundleIdPrefix: org.example.fleet
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Fleet:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Fleet.entitlements
      - path: Shared
      - path: ../docs/stack.md
        buildPhase: resources
    dependencies:
      - target: FleetWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEET_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Fleet.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: targeted
  FleetWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - FleetWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEET_WIDGET_BUNDLE_ID)
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/FleetWidgets.entitlements
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "4"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
  FleetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Fleet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEET_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  FleetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Fleet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(FLEET_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Fleet:
    build:
      targets:
        Fleet: all
        FleetWidgets: all
        FleetTests: [test]
        FleetUITests: [test]
    test:
      config: Debug
      targets:
        - FleetTests
        - FleetUITests
    archive:
      config: Release
  FleetWidgets:
    build:
      targets:
        FleetWidgets: all
