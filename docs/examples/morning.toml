# Copy to ~/.config/fleet/morning.toml and replace the host aliases with the
# names in ~/.ssh/config. Roles match docs/examples/placement.toml.
# primary: the Mac a person uses. hub: always-on home machine. shared: the other one.

hosts = ["primary", "hub", "shared"]
hub = "hub"
notify_host = "primary"
tz = "local"          # this Mac's own zone; or an IANA name such as "Europe/Paris"
probe_s = 20

[disk]
floor_gb = 40
fail_ratio = 0.5          # free under floor * ratio is a fail
trend_warn_gb = -20       # 24 h change in free space, at or below this is a warn
trend_fail_gb = -80

# Per-Mac lines for the internal disk come from a targets file when it has a row for the Mac:
# host<TAB>target_empty<TAB>target_with_purgeable<TAB>floor_empty<TAB>note   (GB)
# Below the target is a warning, below the floor a failure. Default path:
# ~/.local/state/mac-sync/storage-audit/free-targets.tsv
# targets_file = "~/.config/fleet/free-targets.tsv"

# A floor written here wins over the targets file.
[disk.floors.primary]
internal = 80

[disk.floors.hub]
internal = 40

[disk.floors.shared]
internal = 30

[backups]
idrive_warn_h = 36
idrive_fail_h = 72
drive_mirror_warn_h = 26
drive_mirror_fail_h = 48
hdd_backup_warn_h = 36
hdd_backup_fail_h = 168
icloud_stall_h = 6
idrive_hosts = ["primary"]
mirror_hosts = ["hub"]
hdd_hosts = ["hub"]
icloud_hosts = ["primary"]
syncthing_hosts = ["primary", "hub", "shared"]

[jobs]
overdue_h = 2
# Launchd label prefixes to strip from job names. Empty reads ~/.config/fleet/utc-prefixes.
# label_prefixes = ["com.example."]

[thermal]
# Hot is judged against each Mac's own heavy-slot `cool` target (~/.local/state/heavy-slot/cool),
# which its snapshot carries. hot_c is only the line for a Mac that sends none.
# hot_c = 95
hot_hours_warn = 2
hot_hours_fail = 6
wait_warn_s = 600
gap_s = 900

[capacity]
near_empty_pct = 10
near_empty_jobs = 5
stale_h = 3

[agents]
stale_claim_h = 6
unread_mail_h = 12

[projects]
heavy_runtime_s = 60
active_host = "primary"
