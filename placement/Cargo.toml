[package]
name = "placement"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Decide where each data set lives, and keep it there"

[[bin]]
name = "placement"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
